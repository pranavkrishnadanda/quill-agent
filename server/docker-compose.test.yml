services:
  greenmail:
    image: greenmail/standalone:2.1.0
    container_name: job-agent-greenmail-test
    ports:
      - "3025:3025"   # SMTP
      - "3143:3143"   # IMAP
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp
        -Dgreenmail.setup.test.imap
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=testuser:testpass@localhost
        -Dgreenmail.verbose
