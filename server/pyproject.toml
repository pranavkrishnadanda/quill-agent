[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "job-agent-server"
version = "0.1.0"
description = "Local IMAP verification-code server for the job-application browser agent"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "imapclient>=3.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
asyncio_mode = "auto"
markers = [
    "integration: tests that require Greenmail running via docker-compose.test.yml",
    "e2e: end-to-end tests that boot the FastAPI server",
    "real_gmail: opt-in E2E tests that hit real Gmail (requires REAL_GMAIL_USER / REAL_GMAIL_APP_PASSWORD)",
]
