<!-- Minimal Greenhouse-style application form fixture -->
<form id="application_form" action="/careers/apply" method="post" enctype="multipart/form-data">
  <div class="field">
    <label for="full_name">Full Name<span class="required">*</span></label>
    <input type="text" id="full_name" name="job_application[full_name]" autocomplete="name" required />
  </div>

  <div class="field">
    <label for="email">Email<span class="required">*</span></label>
    <input type="email" id="email" name="job_application[email]" autocomplete="email" required />
  </div>

  <div class="field">
    <label for="phone">Phone</label>
    <input type="tel" id="phone" name="job_application[phone]" autocomplete="tel" />
  </div>

  <div class="field">
    <label for="linkedin">LinkedIn Profile</label>
    <input type="text" id="linkedin" name="job_application[urls][LinkedIn]" placeholder="https://linkedin.com/in/..." />
  </div>

  <div class="field">
    <label for="resume">Resume/CV<span class="required">*</span></label>
    <input type="file" id="resume" name="job_application[resume]" accept=".pdf,.doc,.docx" required />
  </div>

  <div class="field">
    <label for="cover_letter">Cover Letter</label>
    <textarea id="cover_letter" name="job_application[cover_letter]" rows="8" cols="60"></textarea>
  </div>

  <div class="field">
    <label for="years_of_experience">Years of Experience<span class="required">*</span></label>
    <select id="years_of_experience" name="job_application[answers][years_of_experience]" required>
      <option value="">-- Select --</option>
      <option value="0-1">0-1</option>
      <option value="2-4">2-4</option>
      <option value="5+">5+</option>
      <option value="10+">10+</option>
    </select>
  </div>

  <button type="submit" id="submit_app">Submit Application</button>
</form>
